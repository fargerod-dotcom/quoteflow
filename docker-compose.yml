services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quoteflow
      POSTGRES_PASSWORD: quoteflow
      POSTGRES_DB: quoteflow
    ports:
      - "5432:5432"
    volumes:
      - quoteflow-pgdata:/var/lib/postgresql/data

volumes:
  quoteflow-pgdata:
